# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'olist_transform'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'olist_transform'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# --- Enterprise Data Architecture Layers ---
models:
  olist_transform:
    +materialized: view        # Default everything to views
    
    staging:
      +materialized: view      # Staging models will build as fast, lightweight views
      
    marts:
      +materialized: table     # Marts models will build as high-performance physical tables